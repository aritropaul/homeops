app = "homeops"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 10
    soft_limit = 5

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health/live"
    protocol = "http"

[[vm]]
  memory = "256mb"
  cpus = 1
  memory_mb = 256
